<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>TonhTze AI · Handwriting IME</title>
<link rel="icon" href="/static/icon.png" />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="ime" id="ime">

  <!-- 顶栏 -->
  <header class="ime-head">
    <div class="brand">
      <span class="brand-dot"></span>
      <span>TonhTze 手写输入法</span>
    </div>
    <div class="tabs">
      <button class="tab active" data-mode="input">输入</button>
      <button class="tab" data-mode="collect">采集</button>
    </div>
    <div class="meta" id="meta">连接中…</div>
    <div class="winctl">
      <button id="minBtn" title="隐藏面板（Ctrl+Alt+H 唤回）">—</button>
      <button id="closeBtn" title="退出">×</button>
    </div>
  </header>

  <!-- 候选字 -->
  <section class="candbar" id="candbar">
    <div class="cand empty">书写后显示候选</div>
  </section>

  <!-- 候选词（只显示 dh） -->
  <section class="wordbar" id="wordbar"></section>

  <!-- 书写区 -->
  <section class="padwrap">
    <canvas id="pad"></canvas>
    <div class="padhint" id="padhint">在此书写 · 支持手写笔 / 触控 / 鼠标</div>
    <div class="casebadge" id="casebadge">大小写：自动</div>
  </section>

  <!-- 采集控制条 -->
  <section class="collectbar hidden" id="collectbar">
    <div class="target">
      <span class="tlabel">目标字符</span>
      <span class="tchar" id="tchar">0</span>
      <span class="tprog" id="tprog">0 / 0</span>
    </div>
    <div class="collectctl">
      <select id="targetSel" title="选择要采集的字符"></select>
      <label>每类 <input id="quota" type="number" min="1" max="99" value="10" /> 个</label>
      <label>存入
        <select id="splitSel">
          <option value="train">训练集</option>
          <option value="test">测试集</option>
        </select>
      </label>
      <button id="undoBtn" class="btn btn-ghost">撤销上一条</button>
      <button id="skipBtn" class="btn btn-ghost">跳过</button>
    </div>
  </section>

  <!-- 文本输出 -->
  <section class="output" id="output">
    <span class="placeholder" id="ph">识别结果会出现在这里</span><span id="text"></span><span class="caret"></span>
  </section>

  <!-- 功能键区 -->
  <section class="keys">
    <div class="keyrow nav">
      <button class="key" data-key="left"  title="左移">←</button>
      <button class="key" data-key="up"    title="上移">↑</button>
      <button class="key" data-key="down"  title="下移">↓</button>
      <button class="key" data-key="right" title="右移">→</button>
      <button class="key" data-key="home"  title="行首">Home</button>
      <button class="key" data-key="end"   title="行尾">End</button>
      <button class="key" data-key="backspace" title="退格">退格</button>
      <button class="key" data-key="enter" title="回车">回车</button>
      <button class="key" data-key="tab"   title="Tab">Tab</button>
      <button class="key" data-key="esc"   title="Esc">Esc</button>
    </div>
    <div class="keyrow act">
      <button class="key wide" id="shiftBtn">Shift 大小写</button>
      <button class="key" id="spaceBtn">空格</button>
      <button class="key" id="commitBtn">确认</button>
      <button class="key" id="copyBtn">复制</button>
      <button class="key primary" id="sendBtn" title="把识别结果发送到光标所在的输入框">发送</button>
      <button class="key danger" id="clearBtn">清空</button>
    </div>
  </section>

  <footer class="statusbar">
    <span id="status">就绪</span>
    <span id="latency"></span>
  </footer>
</div>
<script src="/static/app.js"></script>
</body>
</html>
